name: Playwright Tests
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "src/**"
      - "server/**"
      - "tests/e2e/**"
      - "tests/features/**"
      - "playwright.config.js"
      - "cucumber.js"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/playwright.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - "src/**"
      - "server/**"
      - "tests/e2e/**"
      - "tests/features/**"
      - "playwright.config.js"
      - "cucumber.js"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/playwright.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests (e2e)
        run: npx playwright test
      - name: Run Cucumber tests (BDD)
        run: npx cucumber-js
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
