sonar.projectKey=OkHandTone_Seminaire_automatisation_securite
sonar.organization=okhandtone
sonar.projectName=Seminaire automatisation securite

sonar.sources=src,server,client
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Rapport de couverture généré par Vitest (npm run coverage).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclu de l'ANALYSE : dépendances et artefacts générés.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/playwright-report/**,**/test-results/**

# Exclu de la MÉTRIQUE DE COUVERTURE :
# - client/** : front React couvert par les tests e2e (Playwright), pas en unitaire
# - server/index.js : simple point d'entrée (démarre le serveur)
# - fichiers de config
sonar.coverage.exclusions=client/**,server/index.js,**/*.config.js
