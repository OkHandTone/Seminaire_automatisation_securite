<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventSphere — Inscription à l'événement</title>
  <style>
    :root { --accent: #4f46e5; --bg: #f5f6fa; --err: #dc2626; --ok: #16a34a; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); margin: 0; padding: 2rem; color: #1f2937;
    }
    main { max-width: 460px; margin: 0 auto; background: #fff;
      padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.06); }
    h1 { margin-top: 0; font-size: 1.4rem; }
    p.sous-titre { color: #6b7280; margin-top: -.5rem; }
    label { display: block; margin: 1rem 0 .25rem; font-weight: 600; }
    input, select { width: 100%; padding: .6rem; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 1rem; }
    button { margin-top: 1.5rem; width: 100%; padding: .75rem; border: 0;
      border-radius: 8px; background: var(--accent); color: #fff;
      font-size: 1rem; font-weight: 600; cursor: pointer; }
    .erreur { color: var(--err); font-size: .85rem; min-height: 1rem; margin-top: .25rem; }
    #confirmation { margin-top: 1.5rem; padding: 1rem; border-radius: 8px;
      background: #ecfdf5; color: var(--ok); display: none; }
    #confirmation.visible { display: block; }
    #badge { font-family: monospace; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1 id="titre">Salon de la Tech 2026</h1>
    <p class="sous-titre">Inscrivez-vous et récupérez votre badge d'accès.</p>

    <form id="formulaire-inscription" novalidate>
      <label for="nom">Nom complet</label>
      <input type="text" id="nom" name="nom" autocomplete="name">
      <div class="erreur" id="erreur-nom"></div>

      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email" autocomplete="email">
      <div class="erreur" id="erreur-email"></div>

      <label for="type">Type de billet</label>
      <select id="type" name="type">
        <option value="">— Choisir —</option>
        <option value="standard">Standard</option>
        <option value="vip">VIP</option>
        <option value="presse">Presse</option>
      </select>
      <div class="erreur" id="erreur-type"></div>

      <button type="submit" id="bouton-inscription">S'inscrire</button>
    </form>

    <div id="confirmation">
      Inscription confirmée ! Votre identifiant de badge :
      <span id="badge"></span>
    </div>
  </main>

  <script type="module">
    import { validerInscription } from './src/inscription.mjs';

    const form = document.getElementById('formulaire-inscription');
    const confirmation = document.getElementById('confirmation');
    const badge = document.getElementById('badge');

    const champs = ['nom', 'email', 'type'];

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      // Réinitialise l'affichage des erreurs et de la confirmation.
      champs.forEach((c) => {
        document.getElementById(`erreur-${c}`).textContent = '';
      });
      confirmation.classList.remove('visible');

      const donnees = {
        nom: document.getElementById('nom').value,
        email: document.getElementById('email').value,
        type: document.getElementById('type').value,
      };

      const resultat = validerInscription(donnees);

      if (!resultat.valide) {
        Object.entries(resultat.erreurs).forEach(([champ, message]) => {
          document.getElementById(`erreur-${champ}`).textContent = message;
        });
        return;
      }

      badge.textContent = resultat.badge;
      confirmation.classList.add('visible');
      form.reset();
    });
  </script>
</body>
</html>
