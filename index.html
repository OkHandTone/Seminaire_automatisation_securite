<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventSphere — Inscription à l'événement</title>
  <style>
    :root { --accent: #4f46e5; --bg: #f5f6fa; --err: #dc2626; --ok: #16a34a; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); margin: 0; padding: 2rem; color: #1f2937;
    }
    main { max-width: 460px; margin: 0 auto; background: #fff;
      padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.06); }
    h1 { margin-top: 0; font-size: 1.4rem; }
    p.sous-titre { color: #6b7280; margin-top: -.5rem; }
    label { display: block; margin: 1rem 0 .25rem; font-weight: 600; }
    input, select { width: 100%; padding: .6rem; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 1rem; }
    button { margin-top: 1.5rem; width: 100%; padding: .75rem; border: 0;
      border-radius: 8px; background: var(--accent); color: #fff;
      font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: progress; }
    .erreur { color: var(--err); font-size: .85rem; min-height: 1rem; margin-top: .25rem; }
    #confirmation { margin-top: 1.5rem; padding: 1rem; border-radius: 8px;
      background: #ecfdf5; color: var(--ok); }
    #confirmation[hidden] { display: none; }
    #badge { font-family: monospace; font-weight: 700; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React vendoré localement : aucun appel à un CDN tiers à l'exécution. -->
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/htm.js"></script>

  <script type="module">
    const html = window.htm.bind(React.createElement);
    const { useState } = React;

    // URL du mini serveur node (API). Surchargeable via window.__API_URL__.
    const API_URL = window.__API_URL__ || 'http://localhost:3001';

    function App() {
      const [form, setForm] = useState({ nom: '', email: '', type: '' });
      const [erreurs, setErreurs] = useState({});
      const [badge, setBadge] = useState(null);
      const [erreurReseau, setErreurReseau] = useState(null);
      const [envoiEnCours, setEnvoiEnCours] = useState(false);

      const maj = (champ) => (e) =>
        setForm((f) => ({ ...f, [champ]: e.target.value }));

      async function soumettre(e) {
        e.preventDefault();
        setErreurs({});
        setBadge(null);
        setErreurReseau(null);
        setEnvoiEnCours(true);
        try {
          const res = await fetch(`${API_URL}/api/inscriptions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(form),
          });
          const data = await res.json();
          if (res.ok) {
            setBadge(data.badge);
            setForm({ nom: '', email: '', type: '' });
          } else {
            setErreurs(data.erreurs || {});
          }
        } catch (err) {
          setErreurReseau("Impossible de contacter le serveur. Est-il démarré ?");
        } finally {
          setEnvoiEnCours(false);
        }
      }

      return html`
        <main>
          <h1 id="titre">Salon de la Tech 2026</h1>
          <p class="sous-titre">Inscrivez-vous et récupérez votre badge d'accès.</p>

          <form id="formulaire-inscription" onSubmit=${soumettre} noValidate>
            <label htmlFor="nom">Nom complet</label>
            <input id="nom" name="nom" autoComplete="name"
                   value=${form.nom} onChange=${maj('nom')} />
            <div class="erreur" id="erreur-nom">${erreurs.nom || ''}</div>

            <label htmlFor="email">Adresse e-mail</label>
            <input id="email" name="email" type="email" autoComplete="email"
                   value=${form.email} onChange=${maj('email')} />
            <div class="erreur" id="erreur-email">${erreurs.email || ''}</div>

            <label htmlFor="type">Type de billet</label>
            <select id="type" name="type" value=${form.type} onChange=${maj('type')}>
              <option value="">— Choisir —</option>
              <option value="standard">Standard</option>
              <option value="vip">VIP</option>
              <option value="presse">Presse</option>
            </select>
            <div class="erreur" id="erreur-type">${erreurs.type || ''}</div>

            <button type="submit" id="bouton-inscription" disabled=${envoiEnCours}>
              ${envoiEnCours ? 'Envoi…' : "S'inscrire"}
            </button>
          </form>

          ${erreurReseau
            ? html`<div class="erreur" id="erreur-reseau">${erreurReseau}</div>`
            : null}

          <div id="confirmation" hidden=${!badge}>
            Inscription confirmée ! Votre identifiant de badge :
            <span id="badge">${badge || ''}</span>
          </div>
        </main>
      `;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
